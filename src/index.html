<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Stack - Medya, Proje ve Günlük Takip</title>
    <link href="tailwind.css" rel="stylesheet">
    <link href="fa/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e5e5e5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-dark min-h-screen pb-20">

    <!-- Giriş Ekranı (Sadece Kullanıcı Adı) -->
    <div id="auth-screen" class="fixed inset-0 bg-dark z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-card w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-gray-800 text-center">
            <h1 class="text-3xl font-black text-white tracking-wider mb-2">STACK</h1>
            <p class="text-sm text-gray-400 mb-6">Kişisel arşivine hoş geldin. Başlamak için bir kullanıcı adı belirle.</p>
            
            <form id="auth-form" class="flex flex-col gap-4">
                <input type="text" id="username-input" placeholder="Kullanıcı Adı (Örn: urg4n)" required class="w-full bg-dark border border-gray-700 rounded-xl p-3 text-white text-center focus:outline-none focus:border-primary text-sm">
                <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white font-medium p-3 rounded-xl transition text-sm">Girişe Başla</button>
            </form>
        </div>
    </div>

    <!-- Hedefler Modalı -->
    <div id="goals-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50 p-4">
        <div class="bg-card w-full max-w-2xl rounded-xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fas fa-bullseye text-primary"></i> Hedefler Arşivi
                </h2>
                <div class="flex items-center gap-2">
                    <button onclick="openGoalAddModal()" class="bg-primary hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                        <i class="fas fa-plus"></i> Hedef Ekle
                    </button>
                    <button onclick="closeGoalsModal()" class="text-gray-400 hover:text-white p-1.5"><i class="fas fa-times text-base"></i></button>
                </div>
            </div>
            
            <div class="flex flex-col gap-3 text-sm text-gray-300" id="goals-list-container"></div>
            
            <div class="mt-4 text-right pt-3 border-t border-gray-800">
                <button onclick="closeGoalsModal()" class="px-4 py-2 rounded bg-gray-800 text-gray-300 hover:bg-gray-700 transition text-sm">Kapat</button>
            </div>
        </div>
    </div>

    <!-- Yeni Hedef Grubu Ekleme Modalı -->
    <div id="goal-add-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-50 p-4">
        <div class="bg-card w-full max-w-md rounded-xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto border border-gray-800">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                <h2 class="text-lg font-bold text-white">Yeni Hedef Grubu Ekle</h2>
                <button onclick="closeGoalAddModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>

            <form id="goal-custom-form" class="flex flex-col gap-3">
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">1. Yıl Seçimi</label>
                    <input type="text" id="g-year" placeholder="Örn: 2026" required class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white text-sm focus:outline-none focus:border-primary">
                </div>

                <div>
                    <label class="text-xs text-gray-400 mb-1 block">2. Yıl İçin Başlık / Tema Koyma</label>
                    <input type="text" id="g-title" placeholder="Örn: Yazılım ve Eğitim Yılı" required class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white text-sm focus:outline-none focus:border-primary">
                </div>

                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="closeGoalAddModal()" class="px-4 py-2 rounded text-gray-300 hover:bg-gray-800 transition text-sm">İptal</button>
                    <button type="submit" class="px-4 py-2 rounded bg-primary text-white hover:bg-blue-600 transition text-sm">Hedef Grubunu Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Günlük Takvim Modalı -->
    <div id="journal-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50 p-4">
        <div class="bg-card w-full max-w-3xl rounded-xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                <div class="flex items-center gap-3">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fas fa-calendar-alt text-primary"></i> Günlük Takvimi
                    </h2>
                    <div class="flex items-center gap-1 bg-darker px-2 py-1 rounded-lg border border-gray-800 text-xs">
                        <button onclick="changeMonth(-1)" class="text-gray-400 hover:text-white px-2 py-0.5"><i class="fas fa-chevron-left"></i></button>
                        <span id="calendar-month-year" class="font-bold text-white px-2">Ocak 2026</span>
                        <button onclick="changeMonth(1)" class="text-gray-400 hover:text-white px-2 py-0.5"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <button onclick="closeJournalModal()" class="text-gray-400 hover:text-white p-1.5"><i class="fas fa-times text-base"></i></button>
            </div>
            
            <div class="bg-darker p-3 rounded-xl border border-gray-800">
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-gray-400 mb-2">
                    <div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5"></div>
            </div>
            
            <div class="mt-4 text-right pt-3 border-t border-gray-800">
                <button onclick="closeJournalModal()" class="px-4 py-2 rounded bg-gray-800 text-gray-300 hover:bg-gray-700 transition text-sm">Kapat</button>
            </div>
        </div>
    </div>

    <!-- Günlük Detay Modalı -->
    <div id="journal-view-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-50 p-4">
        <div class="bg-card w-full max-w-lg rounded-xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto border border-gray-800">
            <div class="flex justify-between items-center mb-3 border-b border-gray-800 pb-2">
                <span id="view-j-date" class="text-xs bg-blue-500/20 text-primary px-2.5 py-1 rounded font-medium"></span>
                <button onclick="closeJournalViewModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <h3 id="view-j-title" class="text-lg font-bold text-white mb-3"></h3>
            <div class="bg-dark p-3.5 rounded-lg border border-gray-800 text-xs text-gray-300 whitespace-pre-wrap leading-relaxed max-h-[50vh] overflow-y-auto mb-4" id="view-j-notes"></div>
            <div class="flex justify-between items-center pt-2 border-t border-gray-800">
                <button id="delete-journal-btn" onclick="" class="text-red-400 hover:text-red-300 text-xs flex items-center gap-1"><i class="fas fa-trash-alt"></i> Günlüğü Sil</button>
                <button onclick="closeJournalViewModal()" class="px-3 py-1.5 rounded bg-gray-800 text-gray-300 hover:bg-gray-700 text-xs">Kapat</button>
            </div>
        </div>
    </div>

    <!-- Günlük Ekleme Formu Modalı -->
    <div id="journal-add-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-50 p-4">
        <div class="bg-card w-full max-w-md rounded-xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto border border-gray-800">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                <h2 id="journal-add-title" class="text-lg font-bold text-white">Günlük Ekle</h2>
                <button onclick="closeJournalAddModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>

            <form id="journal-custom-form" class="flex flex-col gap-3">
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Tarih</label>
                    <input type="date" id="j-date" required readonly class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white text-sm opacity-70 cursor-not-allowed">
                </div>

                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Başlık</label>
                    <input type="text" id="j-title" placeholder="Günlük başlığı..." required class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white text-sm focus:outline-none focus:border-primary">
                </div>

                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Notlar (Karakter Sınırı Yoktur)</label>
                    <textarea id="j-notes" placeholder="Bugün neler yaptın..." rows="6" required class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white text-sm focus:outline-none focus:border-primary resize-y"></textarea>
                </div>

                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="closeJournalAddModal()" class="px-4 py-2 rounded text-gray-300 hover:bg-gray-800 transition text-sm">İptal</button>
                    <button type="submit" class="px-4 py-2 rounded bg-primary text-white hover:bg-blue-600 transition text-sm">Günlüğü Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Üst Menü -->
    <header class="bg-darker p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-2xl font-bold text-white tracking-wider mr-2">STACK</h1>
            <button onclick="openGoalsModal()" class="flex items-center gap-1.5 bg-gray-800 hover:bg-gray-700 text-primary border border-gray-700 px-3 py-1.5 rounded-full text-xs font-semibold transition shadow-sm">
                <i class="fas fa-bullseye"></i> Hedefler
            </button>
            <button onclick="openJournalModal()" class="flex items-center gap-1.5 bg-gray-800 hover:bg-gray-700 text-primary border border-gray-700 px-3 py-1.5 rounded-full text-xs font-semibold transition shadow-sm">
                <i class="fas fa-calendar-alt"></i> Günlük
            </button>
            <span id="user-display" class="text-xs bg-gray-800 text-gray-300 px-2.5 py-1 rounded-full border border-gray-700 hidden"></span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="logout()" title="Çıkış Yap" class="text-gray-400 hover:text-red-400 p-2 text-sm transition"><i class="fas fa-right-from-bracket"></i></button>
            <button onclick="openModal()" class="bg-primary hover:bg-blue-600 text-white p-2 rounded-full w-10 h-10 flex items-center justify-center transition shadow-lg">
                <i class="fas fa-plus"></i>
            </button>
        </div>
    </header>

    <!-- Kategoriler (Dikey) -->
    <div class="px-4 py-3 bg-darker border-b border-gray-800">
        <h2 class="text-xs text-gray-400 uppercase tracking-wider mb-2 font-semibold">Kategoriler</h2>
        <div class="flex flex-col gap-2" id="category-filters"></div>
    </div>

    <!-- Durum Sekmeleri (Yatay Kaydırılabilir) -->
    <div class="overflow-x-auto hide-scrollbar border-b border-gray-800 bg-dark sticky top-[68px] z-10">
        <div class="flex px-2 w-max" id="status-tabs"></div>
    </div>

    <!-- Medya Listesi -->
    <main class="p-4 flex flex-col gap-4" id="media-list"></main>

    <!-- İçerik Ekleme / Düzenleme Modalı -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50 p-4">
        <div class="bg-card w-full max-w-md rounded-xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 id="modal-title" class="text-xl font-bold mb-4 text-white">İçerik Ekle</h2>
            
            <form id="media-form" class="flex flex-col gap-3">
                <input type="hidden" id="edit-id">
                
                <div class="flex gap-2">
                    <div class="w-1/2">
                        <label class="text-xs text-gray-400 mb-1 block">Kategori</label>
                        <select id="category" class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary text-sm" onchange="updateFormFields()"></select>
                    </div>
                    
                    <div class="w-1/2">
                        <label class="text-xs text-gray-400 mb-1 block">Durum</label>
                        <select id="status" class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary text-sm"></select>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-gray-400 mb-1 block" id="title-label">İçerik Adı</label>
                    <input type="text" id="title" placeholder="İsim / Başlık" required class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary text-sm">
                </div>

                <div id="project-program-field" class="hidden">
                    <label class="text-xs text-gray-400 mb-1 block">Hangi Program ile Çizimi Yapıldı?</label>
                    <input type="text" id="projectProgram" placeholder="Örn: AutoCAD, SketchUp vb." class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary text-sm">
                </div>

                <div id="platform-container">
                    <label class="text-xs text-gray-400 mb-1 block" id="platform-label">Platform / Kaynak</label>
                    <input type="text" id="platform" placeholder="Örn: Netflix, Youtube vb." class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary text-sm">
                </div>

                <div class="flex gap-2">
                    <div class="w-1/2">
                        <label class="text-xs text-gray-400 mb-1 block">Başlangıç Tarihi</label>
                        <input type="date" id="startDate" class="w-full bg-dark border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-primary text-sm">
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs text-gray-400 mb-1 block">Bitiş Tarihi</label>
                        <input type="date" id="endDate" class="w-full bg-dark border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-primary text-sm">
                    </div>
                </div>

                <!-- Bildirim ve Hatırlatıcı Ayarları -->
                <div class="bg-darker p-3 rounded-lg border border-gray-800 flex flex-col gap-2">
                    <label class="text-xs text-yellow-400 font-semibold flex items-center gap-1.5">
                        <i class="fas fa-bell"></i> Hatırlatıcı Bildirim Ayarla
                    </label>
                    <div class="flex gap-2">
                        <div class="w-1/2">
                            <label class="text-[11px] text-gray-400 mb-1 block">Hatırlatma Saati</label>
                            <input type="time" id="reminderTime" class="w-full bg-dark border border-gray-700 rounded p-2 text-white text-sm focus:outline-none focus:border-primary">
                        </div>
                        <div class="w-1/2">
                            <label class="text-[11px] text-gray-400 mb-1 block">Tekrar Sıklığı</label>
                            <select id="reminderRepeat" class="w-full bg-dark border border-gray-700 rounded p-2 text-white text-sm focus:outline-none focus:border-primary">
                                <option value="none">Yok (Tek Sefer)</option>
                                <option value="daily">Günlük</option>
                                <option value="weekly">Haftalık</option>
                                <option value="monthly">Aylık</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="education-fields" class="flex gap-2 hidden">
                    <div class="w-1/2">
                        <label class="text-xs text-gray-400 mb-1 block">Eğitim Saati</label>
                        <input type="text" id="eduHours" placeholder="Örn: 6 Saat" class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary text-sm">
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs text-gray-400 mb-1 block">Ders Sayısı</label>
                        <input type="number" id="eduLessons" placeholder="Örn: 12" class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary text-sm">
                    </div>
                </div>

                <div id="project-desc-field" class="hidden">
                    <label class="text-xs text-gray-400 mb-1 block">Açıklama</label>
                    <textarea id="projectDesc" placeholder="Proje açıklaması..." rows="2" class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary resize-none text-sm"></textarea>
                </div>

                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Bağlantı Linki</label>
                    <input type="url" id="linkUrl" placeholder="https://..." class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary text-sm">
                </div>

                <div class="relative">
                    <label class="text-xs text-gray-400 mb-1 block">İnceleme / Notlar</label>
                    <textarea id="review" placeholder="İnceleme / Notlar (Max 140 karakter)" maxlength="140" rows="3" class="w-full bg-dark border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary resize-none text-sm"></textarea>
                    <div id="char-count" class="text-xs text-gray-400 text-right mt-1">0/140</div>
                </div>

                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded text-gray-300 hover:bg-gray-800 transition text-sm">İptal</button>
                    <button type="submit" class="px-4 py-2 rounded bg-primary text-white hover:bg-blue-600 transition text-sm">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Özel Onay Modalı -->
    <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50 p-4">
        <div class="bg-card w-full max-w-sm rounded-xl p-5 shadow-2xl text-center">
            <h3 class="text-lg font-bold text-white mb-2">İçeriği Sil</h3>
            <p class="text-sm text-gray-400 mb-4">Bu içeriği silmek istediğine emin misin?</p>
            <div class="flex justify-center gap-3">
                <button onclick="closeConfirmModal()" class="px-4 py-2 rounded bg-gray-800 text-gray-300 hover:bg-gray-700 transition text-sm">İptal</button>
                <button id="confirm-yes-btn" class="px-4 py-2 rounded bg-red-600 text-white hover:bg-red-500 transition text-sm">Sil</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            { name: 'Tümü', icon: 'fa-layer-group' },
            { name: 'Proje', icon: 'fa-compass-drafting' },
            { name: 'Film', icon: 'fa-film' },
            { name: 'Dizi', icon: 'fa-tv' },
            { name: 'Belgesel', icon: 'fa-video' },
            { name: 'Tiyatro', icon: 'fa-masks-theater' },
            { name: 'Stand-up', icon: 'fa-microphone-lines' },
            { name: 'Podcast', icon: 'fa-podcast' },
            { name: 'YouTube', icon: 'fa-brands fa-youtube' },
            { name: 'Kitap', icon: 'fa-book' },
            { name: 'Eğitim', icon: 'fa-graduation-cap' },
            { name: 'Makale', icon: 'fa-newspaper' }
        ];

        const statuses = ['Tümü', 'Başlanacak', 'Devam Ediyor', 'Bitirildi', 'İstek Listesi', 'Ödünç Verildi'];
        
        let mediaData = JSON.parse(localStorage.getItem('stackData')) || [];
        let goalsData = JSON.parse(localStorage.getItem('stackCustomGoals')) || [];
        let journalData = JSON.parse(localStorage.getItem('stackJournal')) || [];

        let currentCategory = 'Tümü';
        let currentStatus = 'Tümü';
        let deleteTargetId = null;
        let currentUser = localStorage.getItem('stackUser') || null;
        let calendarDate = new Date();

        function init() {
            checkAuth();
            requestNotificationPermission();
            renderCategories();
            renderStatuses();
            renderList();
            renderGoals();
            
            // Her dakika bildirim kontrolü yap
            setInterval(checkReminders, 60000);

            const reviewInput = document.getElementById('review');
            const charCount = document.getElementById('char-count');
            reviewInput.addEventListener('input', () => {
                charCount.textContent = `${reviewInput.value.length}/140`;
            });

            document.getElementById('auth-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('username-input').value.trim();
                if(username) {
                    currentUser = username;
                    localStorage.setItem('stackUser', currentUser);
                    checkAuth();
                    renderCategories();
                    renderList();
                }
            });

            document.getElementById('goal-custom-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const newGoal = {
                    id: Date.now().toString(),
                    year: document.getElementById('g-year').value,
                    title: document.getElementById('g-title').value,
                    tasks: []
                };

                goalsData.push(newGoal);
                localStorage.setItem('stackCustomGoals', JSON.stringify(goalsData));
                renderGoals();
                closeGoalAddModal();
                document.getElementById('goal-custom-form').reset();
            });

            document.getElementById('journal-custom-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const dateVal = document.getElementById('j-date').value;
                const newJournal = {
                    id: Date.now().toString(),
                    date: dateVal,
                    title: document.getElementById('j-title').value,
                    notes: document.getElementById('j-notes').value
                };

                const existingIdx = journalData.findIndex(j => j.date === dateVal);
                if(existingIdx !== -1) {
                    journalData[existingIdx] = newJournal;
                } else {
                    journalData.push(newJournal);
                }

                localStorage.setItem('stackJournal', JSON.stringify(journalData));
                closeJournalAddModal();
                renderCalendar();
                openJournalModal();
            });
        }

        function checkAuth() {
            const authScreen = document.getElementById('auth-screen');
            const userDisplay = document.getElementById('user-display');
            if(!currentUser) {
                authScreen.classList.remove('hidden');
                authScreen.classList.add('flex');
                userDisplay.classList.add('hidden');
            } else {
                authScreen.classList.add('hidden');
                authScreen.classList.remove('flex');
                userDisplay.textContent = currentUser;
                userDisplay.classList.remove('hidden');
            }
        }

        function logout() {
            if(confirm('Çıkış yapmak istediğine emin misin?')) {
                localStorage.removeItem('stackUser');
                currentUser = null;
                checkAuth();
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        function checkReminders() {
            const now = new Date();
            const currentDay = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            const currentTime = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            const currentDayOfWeek = now.getDay(); // 0: Pazar, 1: Pzt...
            const currentDayOfMonth = now.getDate();

            mediaData.forEach(item => {
                if(!item.reminderTime) return;
                
                let shouldNotify = false;
                if(item.reminderRepeat === 'none' && item.startDate === currentDay && item.reminderTime === currentTime) {
                    shouldNotify = true;
                } else if(item.reminderRepeat === 'daily' && item.reminderTime === currentTime) {
                    shouldNotify = true;
                } else if(item.reminderRepeat === 'weekly' && item.startDate) {
                    const startD = new Date(item.startDate + 'T00:00:00');
                    if(startD.getDay() === currentDayOfWeek && item.reminderTime === currentTime) {
                        shouldNotify = true;
                    }
                } else if(item.reminderRepeat === 'monthly' && item.startDate) {
                    const startD = new Date(item.startDate + 'T00:00:00');
                    if(startD.getDate() === currentDayOfMonth && item.reminderTime === currentTime) {
                        shouldNotify = true;
                    }
                }

                if(shouldNotify) {
                    triggerNotification(item.title, item.category);
                }
            });
        }

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("Stack Hatırlatıcı", {

                });
            } else {
                alert(`Hatırlatıcı: "${title}" (${category}) zamanı geldi!`);
            }
        }

            const goal = goalsData.find(g => g.id === goalId);
            if(goal) {

        function toggleTask(goalId, taskId) {
            const goal = goalsData.find(g => g.id === goalId);
            if(goal && goal.tasks) {
                const task = goal.tasks.find(t => t.id === taskId);
                if(task) {
                    task.completed = !task.completed;
                    localStorage.setItem('stackCustomGoals', JSON.stringify(goalsData));
                    renderGoals();
                }
            }
        }

        function deleteTask(goalId, taskId) {
            const goal = goalsData.find(g => g.id === goalId);
            if(goal && goal.tasks) {

    <!-- Android (Capacitor) yerel bildirim köprüsü: tarayıcıda hiçbir şey yapmaz -->
    <script>
    (function () {
        const cap = window.Capacitor;
        if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
        const LN = cap.Plugins && cap.Plugins.LocalNotifications;
        if (!LN) return;

        // Tarayıcı tabanlı kontrolleri devre dışı bırak (çift bildirim olmasın)
        checkReminders = function () {};
        requestNotificationPermission = function () {};

        function nid(id) { return parseInt(String(id).slice(-9), 10) || 1; }

        function nextAt(item) {
            const parts = item.reminderTime.split(':').map(Number);
            const now = new Date();
            let d;
            if (item.reminderRepeat === 'daily' || !item.startDate) {
                d = new Date(); d.setHours(parts[0], parts[1], 0, 0);
            } else {
                const s = item.startDate.split('-').map(Number);
                d = new Date(s[0], s[1] - 1, s[2], parts[0], parts[1], 0);
            }
            if (item.reminderRepeat === 'none') return (item.startDate && d > now) ? d : null;
            if (item.reminderRepeat !== 'daily' && !item.startDate) return null;
            let guard = 0;
            while (d <= now && guard++ < 5000) {
                if (item.reminderRepeat === 'daily') d.setDate(d.getDate() + 1);
                else if (item.reminderRepeat === 'weekly') d.setDate(d.getDate() + 7);
                else d.setMonth(d.getMonth() + 1);
            }
            return d;
        }

        async function syncNativeReminders() {
            try {
                let perm = await LN.checkPermissions();
                if (perm.display !== 'granted') perm = await LN.requestPermissions();
                if (perm.display !== 'granted') return;

                const pending = await LN.getPending();
                if (pending.notifications && pending.notifications.length) {
                    await LN.cancel({ notifications: pending.notifications });
                }

                const list = [];
                mediaData.forEach(item => {
                    if (!item.reminderTime) return;
                    const at = nextAt(item);
                    if (!at) return;
                    const n = {
                        id: nid(item.id),
                        title: 'Stack Hatırlatıcı',
                        body: '"' + item.title + '" (' + item.category + ') zamanı geldi!',
                        schedule: { at: at, allowWhileIdle: true }
                    };
                    const every = { daily: 'day', weekly: 'week', monthly: 'month' }[item.reminderRepeat];
                    if (every) { n.schedule.repeats = true; n.schedule.every = every; }
                    list.push(n);
                });
                if (list.length) await LN.schedule({ notifications: list });
            } catch (e) { console.error('Bildirim planlama hatası', e); }
        }

        const originalSave = saveData;
        saveData = function () { originalSave(); syncNativeReminders(); };
        window.addEventListener('load', function () { setTimeout(syncNativeReminders, 800); });
    })();
    </script>
</body>
